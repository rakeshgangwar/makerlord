# MakerLord vhost — joins the existing nginx on infra. certbot --nginx
# manages the TLS blocks after first issue (.dev is HSTS-preloaded).
server {
    listen 80;
    server_name makerlord.dev;
    client_max_body_size 25m;   # datasheet uploads (curation spec 3.5)

    location /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        # SSE: no buffering, long timeouts, keep the stream alive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    location / {
        # Single-user phase: basic auth over the shell. The API keeps its own
        # bearer token underneath; healthz stays open for monitoring.
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
