# Rotary potentiometer 16 mm, 10 kΩ linear. Power rating 0.5 W is from the
# part's own fzp property. Footprint offsets extracted from the breadboard
# SVG geometry: legs at 0 and 4 holes, wiper centred at 2.
partId: potentiometer_rotary_16mm_5_PotentiometerModuleID
footprint:
  pins:
    leg1: [0, 0]
    wiper: [2, 0]
    leg2: [4, 0]
polarity: nonpolarized
resistanceOhms: 10000
powerRatingW: 0.5
hazardClass: none
# D25 KiCad mapping — official library names (kicad-symbols /
# kicad-footprints). Structural gate now; kicad-cli pad-count verify at ⑨.
kicad:
  symbol: Device:R_Potentiometer
  footprint: Potentiometer_THT:Potentiometer_Alps_RK09K_Single_Vertical
