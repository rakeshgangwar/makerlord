# FiC FRS1B-S 5 V relay (part number from the fzp). Datasheet-verified:
# coil 5 V / 56 Ω → ~89 mA coil draw (0.45 W); contacts 1 A @ 125 VAC / 30 VDC
# (the -S sensitive-coil variant; the fzp's own contact-rating property
# agrees). maxCurrentMa here is the COIL draw — it is what the pin-current
# rule reads when a GPIO tries to drive the coil directly, and 89 mA > 20 mA
# is exactly the finding that should fire. Inductive: flyback required.
# Footprint offsets extracted from the breadboard SVG (two rows, 4 holes apart).
