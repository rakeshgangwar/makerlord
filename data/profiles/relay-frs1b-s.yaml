footprint:
  pins:
    C2: [0, 0]
    COIL2: [4, 0]
    B: [5, 0]
    A: [5, -4]
    COIL1: [4, -4]
    C1: [0, -4]
polarity: nonpolarized
maxCurrentMa: 90
absMaxVoltageV: 6
hazardClass: inductive
