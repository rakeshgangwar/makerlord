# WeMos/LOLIN D1 mini (ESP8266). Datasheet-grounded: 3.3 V logic; ESP8266
# GPIO absolute max ~12 mA per pin. quiescentMa 75 is the wifi-active
# AVERAGE (Espressif datasheet 70-80 mA; peaks 170-300 mA). Deep-sleep is
# ~20 µA for the CHIP — the BOARD figure depends on regulator + LED and is
# exactly the number the power-up gate measures; do not trust it from here.
# absMaxVoltageV 6 covers the 5V USB-input pin; the 3V3 domain nuance
# (3.6 V abs max on GPIO) awaits per-pin voltage domains in the engine.
# Footprint hand-authored from board geometry: two 8-pin rows, 0.1" pitch,
# rows 0.9" apart, silkscreen order.
partId: WeMos_D1_mini_male_headers_above_fix
footprint:
  pins:
    RST: [0, 0]
    A0: [0, 1]
    D0: [0, 2]
    D5: [0, 3]
    D6: [0, 4]
    D7: [0, 5]
    D8: [0, 6]
    "3V3": [0, 7]
    TX: [9, 0]
    RX: [9, 1]
    D1: [9, 2]
    D2: [9, 3]
    D3: [9, 4]
    D4: [9, 5]
    G: [9, 6]
    "5V": [9, 7]
logicLevelV: 3.3
pinMaxMa: 12
portTotalMaxMa: 60
regulatorMaxMa: 500
absMaxVoltageV: 6
quiescentMa: 75
hazardClass: none
# ── D48 GPIO facet. Sources: ESP8266EX datasheet §3 (strapping: GPIO0/
# GPIO2 HIGH, GPIO15 LOW at reset — table "Strapping Pins"); D1 mini
# schematic (A0 = ADC via 220k/100k divider → 3.2 V max at the BOARD pin;
# bare-chip TOUT limit is 1.0 V); GPIO16 (D0) is the RTC wake pin — no
# PWM, no attachInterrupt. TX/RX are UART0 — usable as GPIO but noted, the
# serial monitor owns them. Board pin ↔ GPIO: D0=16 D1=5 D2=4 D3=0 D4=2
# D5=14 D6=12 D7=13 D8=15.
fqbn: esp8266:esp8266:d1_mini
flash: { protocol: esptool-js, baud: 460800 }
gpio:
  A0: { analogIn: true, analogMaxV: 3.2 }
  D0: { digital: true, pwm: false, interrupt: false, note: "GPIO16 — deep-sleep wake, no PWM/interrupt" }
  D1: { digital: true, pwm: true, interrupt: true, note: "GPIO5 — I2C SCL by convention" }
  D2: { digital: true, pwm: true, interrupt: true, note: "GPIO4 — I2C SDA by convention" }
  D3: { digital: true, pwm: true, interrupt: true, strap: { atBoot: HIGH, why: "GPIO0 LOW at reset enters flash mode" } }
  D4: { digital: true, pwm: true, interrupt: true, builtinLed: true, strap: { atBoot: HIGH, why: "GPIO2 must be HIGH at reset to boot" } }
  D5: { digital: true, pwm: true, interrupt: true, note: "GPIO14 — SPI SCK" }
  D6: { digital: true, pwm: true, interrupt: true, note: "GPIO12 — SPI MISO" }
  D7: { digital: true, pwm: true, interrupt: true, note: "GPIO13 — SPI MOSI" }
  D8: { digital: true, pwm: true, interrupt: true, strap: { atBoot: LOW, why: "GPIO15 HIGH at reset prevents boot" } }
  TX: { digital: true, note: "GPIO1 — UART0 TX; the serial monitor owns it" }
  RX: { digital: true, note: "GPIO3 — UART0 RX; the serial monitor owns it" }
