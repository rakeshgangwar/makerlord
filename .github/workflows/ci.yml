name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The parts corpus (~365 MB submodule) is cached against its pinned SHA
      # so most runs skip the clone entirely.
      - name: Resolve corpus SHA
        id: corpus
        run: echo "sha=$(git ls-tree HEAD vendor/fritzing-parts --object-only)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: corpus-cache
        with:
          path: vendor/fritzing-parts
          key: fritzing-parts-${{ steps.corpus.outputs.sha }}
      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 vendor/fritzing-parts

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The sim known-answer suite runs against the real solver, as on the
      # bench: a silent skip once shipped a wrong diode model.
      - name: Install ngspice
        run: sudo apt-get update -q && sudo apt-get install -y -q ngspice

      # The firmware compile gate runs against the real compiler — same
      # contract. Cores are the heavy part; cache them by pinned version.
      - uses: actions/cache@v4
        id: arduino-cores
        with:
          path: ~/.arduino15
          key: arduino-cores-avr1.8.8-esp8266-3.1.2
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cores
        if: steps.arduino-cores.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr esp8266:esp8266

      - run: pnpm install --frozen-lockfile

      # Typecheck + the full Vitest suite (danger corpus included).
      - run: pnpm test

      - name: svelte-check
        run: pnpm --filter @makerlord/ui run check

      # The bridge ships as one self-spawning file — installable anywhere
      # with install.sh --bundle, no checkout needed.
      - name: Bundle maker-bridge
        run: node scripts/build-bridge-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: maker-bridge
          path: dist/bridge.cjs
          if-no-files-found: error

  # Browser-level safety sweep (UI spec §14): a BLOCKER visible at every
  # breakpoint, no dismiss control anywhere, prose can't clear a card.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve corpus SHA
        id: corpus
        run: echo "sha=$(git ls-tree HEAD vendor/fritzing-parts --object-only)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: corpus-cache
        with:
          path: vendor/fritzing-parts
          key: fritzing-parts-${{ steps.corpus.outputs.sha }}
      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 vendor/fritzing-parts

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The e2e seeder runs debug_start, whose fault signatures need the
      # real solver.
      - name: Install ngspice
        run: sudo apt-get update -q && sudo apt-get install -y -q ngspice

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: packages/ui
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @makerlord/ui exec playwright install --with-deps chromium

      - name: Playwright e2e
        run: pnpm --filter @makerlord/ui run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/ui/playwright-report
            packages/ui/test-results
          if-no-files-found: ignore
